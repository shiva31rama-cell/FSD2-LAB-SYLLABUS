name: CampusFlow AI CI

on:
  push:
    branches: [fsd2-capstone-project]
  pull_request:
    branches: [fsd2-capstone-project]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: |
          node --check capstone-campusflow-ai/server/server.js
          node --check capstone-campusflow-ai/server/seed.js
          node --check capstone-campusflow-ai/server/models/User.js
          node --check capstone-campusflow-ai/server/models/Task.js
          node --check capstone-campusflow-ai/server/models/Announcement.js
          node --check capstone-campusflow-ai/server/models/AuditLog.js
          node --check capstone-campusflow-ai/server/models/KnowledgeChunk.js
          node --check capstone-campusflow-ai/server/models/AIAction.js
          node --check capstone-campusflow-ai/server/models/Notification.js
          node --check capstone-campusflow-ai/server/models/Course.js
          node --check capstone-campusflow-ai/server/models/Enrollment.js
          node --check capstone-campusflow-ai/server/models/AttendanceSession.js
          node --check capstone-campusflow-ai/server/models/AttendanceRecord.js
          node --check capstone-campusflow-ai/server/middleware/auth.js
          node --check capstone-campusflow-ai/server/middleware/validate.js
          node --check capstone-campusflow-ai/server/routes/auth.js
          node --check capstone-campusflow-ai/server/routes/tasks.js
          node --check capstone-campusflow-ai/server/routes/announcements.js
          node --check capstone-campusflow-ai/server/routes/dashboard.js
          node --check capstone-campusflow-ai/server/routes/ai.js
          node --check capstone-campusflow-ai/server/routes/aiActions.js
          node --check capstone-campusflow-ai/server/routes/admin.js
          node --check capstone-campusflow-ai/server/routes/notifications.js
          node --check capstone-campusflow-ai/server/routes/knowledge.js
          node --check capstone-campusflow-ai/server/routes/courses.js
          node --check capstone-campusflow-ai/server/routes/attendance.js
          node --check capstone-campusflow-ai/server/services/audit.js
          node --check capstone-campusflow-ai/server/services/chunkText.js
          node --check capstone-campusflow-ai/server/services/notificationWorker.js
      - name: Run unit tests
        run: npm test
      - name: Build React client
        run: npx vite build capstone-campusflow-ai/client

  atlas-integration:
    if: ${{ secrets.CAMPUSFLOW_TEST_MONGO_URI != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run authenticated Atlas integration suite
        env:
          MONGO_URI: ${{ secrets.CAMPUSFLOW_TEST_MONGO_URI }}
          SESSION_SECRET: ${{ secrets.CAMPUSFLOW_TEST_SESSION_SECRET }}
          NODE_ENV: test
        run: node --test capstone-campusflow-ai/server/tests/atlas.integration.test.js
