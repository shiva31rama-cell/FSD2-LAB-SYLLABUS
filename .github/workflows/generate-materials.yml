name: Generate FSD2 Lab Materials

on:
  push:
    paths-ignore:
      - "tools/fsd2_bundle_[0-9][0-9].b64"
      - "tools/fsd2_source_bundle.b64"
      - "**/*.pptx"
      - "**/*.pdf"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-materials:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install material-generation packages
        run: python -m pip install --upgrade pip pillow python-pptx reportlab
      - name: Restore FSD2 source tree
        run: |
          : > /tmp/fsd2_bundle.b64
          for part in $(ls tools/fsd2_bundle_[0-9][0-9].b64 | sort); do cat "$part" >> /tmp/fsd2_bundle.b64; done
          base64 -d /tmp/fsd2_bundle.b64 | tar -xz -C .
      - name: Generate PPTs, runtime PDFs and visual assets
        run: python tools/generate_materials.py
      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "docs: add FSD2 lab source PPTs PDFs and visuals [skip ci]"
            git push
          fi
