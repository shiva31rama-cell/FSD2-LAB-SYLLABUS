name: Generate FSD2 Lab Materials

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-materials:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow python-pptx reportlab
      - run: python tools/generate_materials.py
      - name: Commit generated material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: generate FSD2 lab PPTs PDFs and visuals [skip ci]"
          git push
