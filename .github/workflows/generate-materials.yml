name: Generate FSD2 Lab Materials

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-materials:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: npm install
      - name: Check Express and Node programs
        run: |
          node --check 01-express-routing-http-methods-middleware/app.js
          node --check 02-express-templating-form-data/app.js
          node --check 03-express-cookies-sessions-authentication/app.js
          node --check 04-express-database-rest-api/server.js
          node --check 12-augmented-programs-todo-and-quiz/todo-node-express/server.js
      - name: Build React experiments
        run: |
          npx vite build --root 05-react-render-html-jsx-components
          npx vite build --root 06-react-props-states-styles-events
          npx vite build --root 07-react-conditional-lists-forms
          npx vite build --root 08-react-router-updating-screen
          npx vite build --root 09-react-hooks-sharing-data
          npx vite build --root 12-augmented-programs-todo-and-quiz/quiz-react
      - name: Install material-generation packages
        run: python -m pip install --upgrade pip pillow python-pptx reportlab
      - name: Generate PPTs, runtime PDFs and visuals
        run: python tools/generate_materials.py
      - name: Commit generated material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: generate FSD2 lab PPTs PDFs and visuals [skip ci]"
          git push
